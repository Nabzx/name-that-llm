name: Wayfinder ticket
description: A map, research, grilling, prototype, or task ticket in the wayfinder protocol
labels: ["wayfinder:task"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: Also add the matching `wayfinder:*` and `phase-N` labels.
      options:
        - map
        - research
        - grilling
        - prototype
        - task
    validations:
      required: true
  - type: input
    id: part-of
    attributes:
      label: Part of
      description: "The phase's map issue, for example #1"
      placeholder: "#1"
    validations:
      required: false
  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      placeholder: "#n, #n, or nothing"
  - type: textarea
    id: body
    attributes:
      label: Details
      description: For a map issue, use Fog, Decisions so far, and Frontier sections. For an experiment, state the hypothesis and the single change being tested.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: The concrete output. A CV result and log row, a research note with a recommendation, a locked decision.
    validations:
      required: false
